name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Web Dependencies
        run: |
          cd mobile
          npm install

      - name: Build PWA Web Assets
        run: |
          cd mobile
          npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android Platform
        run: |
          cd mobile
          # Create capacitor config if it doesn't exist
          npx cap init "ModelsDev" "com.anomalyco.modelsdev" --web-dir=dist --confirm || true
          npx cap add android || true

      - name: Sync Capacitor Web Assets
        run: |
          cd mobile
          npx cap sync

      - name: Build APK via Gradle
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: models-dev-app-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
